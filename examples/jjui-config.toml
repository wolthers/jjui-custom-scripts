jj_interactive("util", "exec", "--", "node", "PATH_TO/dist/cli.js", "pr", "create", "--change-id", cid)
'''
[[bindings]]
action = "create-pr"
seq = ["x", "p", "c"]
scope = "revisions"
desc = "Create draft PR"

